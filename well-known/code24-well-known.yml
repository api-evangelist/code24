note: >-
  Every named /.well-known/ path was probed on every CODE24 host that resolves. Nothing is served.
  www.code24.nl is a Squarespace site that answers 404 with the site's HTML shell for unknown paths
  (and a small JSON body, {"message":"security.txt not found"}, specifically for
  /.well-known/security.txt). blog.code24.nl is HubSpot and answers 404 with its own HTML shell.
  klanten.code24.nl (the customer portal) 303-redirects every path to /login, so nothing there can
  be read anonymously. Because no path returned a real document, NO WellKnown or SecurityTxt
  pointer is emitted in apis.yml — this file records an absence, not a presence. CODE24 does
  operate a Coordinated Vulnerability Disclosure programme, but publishes it as an HTML page
  (https://www.code24.nl/kwetsbaarheid-melden) rather than as an RFC 9116 security.txt; a
  /securitytxt page exists on the site but its body contains only the words "security.txt".
