    scope statement or certificate number is published. — https://www.code24.nl/home
- name: NEN 7510
  status: claimed
  evidence: >-
    Named in the same site-footer certification badge. NEN 7510 is the Dutch information-security
    standard for healthcare. No certificate or scope statement is published.
- name: DigiD
  status: claimed
  evidence: >-
    Named in the same site-footer certification badge; the DigiD assessment (ICT-beveiligingsassessment)
    is the Dutch government identity-assurance audit. No assessment report is published.
- name: MedMij
  status: qualified
  evidence: >-
    Router24 qualified as a MedMij DVA, audited annually. Externally checkable in the MedMij
    participant register. — https://www.code24.nl/router24, https://medmij.nl/medmij-deelnemers/
regulatory_context:
