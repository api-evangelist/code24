  date: '2026-09-02'
  status: minimal
  artifacts_added: 9
  pass: local-v1
x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    CODE24 states plainly that mConsole has a read/write API and that Connect24 is a FHIR REST API,
    but every reference for them sits behind a customer login — klanten.code24.nl 303-redirects
    every anonymous request to /login and support.code24.nl lands on an Atlassian Jira Service
    Management sign-in — while www.code24.nl is a Squarespace marketing site with no developer
    section and no api./developer./docs. subdomain resolving.
  evidence:
  - url: https://klanten.code24.nl/.well-known/openid-configuration
    status: 303
  - url: https://support.code24.nl/
    status: 200
  - url: https://www.code24.nl/openapi.json
    status: 404
  - url: https://www.code24.nl/epd-koppelingen-en-integraties
    status: 200
  checked: '2026-09-02'
