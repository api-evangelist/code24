x-api-base-finding:
  verdict: missing
  checked: '2026-09-02'
  detail: >-
    repair-api-bases.py returned `missing` for code24 and the docs pass confirms it: CODE24 names no
    API host anywhere it publishes. www.code24.nl is a Squarespace marketing site; no api., developer.
    or docs. subdomain of code24.nl resolves; and the mConsole API, the Connect24 FHIR API and the
    Router24 MedMij DVA are all provisioned per care organisation, so their endpoints are
    customer-specific rather than a single published base. baseURL is deliberately left unset on all
    three apis[] entries rather than guessed from the marketing domain.
  probed:
  - url: https://api.code24.nl/
    status: '<no dns>'
  - url: https://developer.code24.nl/
    status: '<no dns>'
  - url: https://docs.code24.nl/
    status: '<no dns>'
  - url: https://www.code24.nl/openapi.json
    status: 404
