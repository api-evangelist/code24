apis:
- aid: code24:mconsole-epd-api
  name: mConsole EPD API
  description: >-
    mConsole is CODE24's modern EPD (electronic health record). CODE24 states that the record has a
    software interface (API) with which other care systems can read and write care data back into
    mConsole, subject to authorisation, and that care data is stored as zibs
    (zorginformatiebouwstenen) so it can be shared with personal health environments (PGOs). The
    integration surface is described only on the public product pages; no API reference, base URL,
    authentication reference or machine-readable contract is published on any CODE24 host.
  humanURL: https://www.code24.nl/epd-koppelingen-en-integraties
  tags:
  - EHR
  - Integration
  - zibs
  - openEHR
  properties:
  - type: Website
    url: https://www.code24.nl/epd-mconsole
- aid: code24:connect24-fhir-api
  name: Connect24 FHIR API
  description: >-
    Connect24 is CODE24's data-transformation service. CODE24 documents it as using a FHIR REST API
    for reading and writing information, collecting and transforming patient health data in line
    with the Dutch MedMij standard, with an EVS MedMij connector available for PGO access and
    flexible mapping so it works against any source EPD. The FHIR profile set, endpoints and
    capability statement are not published publicly.
  humanURL: https://www.code24.nl/connect24
  tags:
  - FHIR
  - MedMij
  - Data Transformation
  - Health Data Exchange
- aid: code24:router24-medmij-dva
  name: Router24 MedMij DVA
  description: >-
    Router24 is CODE24's DVA (dienstverlener zorgaanbieders) solution under the Dutch MedMij
    afsprakenstelsel. CODE24 states that Router24 fulfils both the authentication role and the
    resource-server role for sharing data with personal health environments (PGOs), and that its
    architecture and technical specifications are audited annually against the MedMij qualification.
    Endpoints are provisioned per care provider; no public base URL or OAuth metadata is published.
  humanURL: https://www.code24.nl/router24
  tags:
  - MedMij
  - DVA
  - OAuth
  - PGO
