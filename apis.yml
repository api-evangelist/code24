aid: code24
name: Code24
description: >-
  CODE24 B.V. is a Dutch healthcare software company in Alkmaar that builds mConsole, a modern,
  modular electronic health record (EPD) for care and mental-health (GGZ) organisations, together
  with a family of "24" modules — Lab24, Opname24 (admissions), CrisisMonitor24, CTB24, Connect24,
  Router24, Dynaform24, Financieel24 and DataWarehouse24. Its architectural position is that a
  modern EPD must be open: care data is stored in standardised form using openEHR archetypes and
  Dutch zibs (zorginformatiebouwstenen), and every record is readable and writable through a
  software interface (API) so other care systems can be integrated without duplicate data entry.
  Connect24 exposes a FHIR REST API for collecting and transforming patient data to the Dutch
  MedMij standard; Router24 is a MedMij-qualified DVA that performs the authentication and
  resource-server roles for routing data to personal health environments (PGOs). CODE24 is also a
  Value Added Reseller of the Cadasto openEHR open data platform. The API surface is real but
  commercial: no developer portal, no public API reference and no machine-readable contract are
  published on any CODE24 host.
